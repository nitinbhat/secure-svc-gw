name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/secure-svc-gw
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/secure-svc-backend
  CONTROLLER_IMAGE: ghcr.io/${{ github.repository_owner }}/secure-svc-gw-controller

jobs:
  # ------------------------------------------------------------------
  # 1. Go unit tests + race detector
  # ------------------------------------------------------------------
  unit:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Build gen-artifacts
        run: go build -buildvcs=false -o bin/gen-artifacts ./cmd/gen-artifacts

      - name: Generate certs + client keys
        run: ./bin/gen-artifacts .

      - name: Unit tests (race detector)
        run: go test -race -count=1 -buildvcs=false ./...

      - name: Benchmarks (quick smoke)
        run: |
          go test -run='^$' -bench=BenchmarkVerify    -benchtime=1s -benchmem ./internal/auth/...
          go test -run='^$' -bench=BenchmarkPool_Pick -benchtime=1s -benchmem ./internal/lb/...

  # ------------------------------------------------------------------
  # 2. Build + push images to GHCR
  # ------------------------------------------------------------------
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    # Only push on main branch; PRs build but don't push
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/gateway.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.GATEWAY_IMAGE }}:latest
            ${{ env.GATEWAY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/controller.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.CONTROLLER_IMAGE }}:latest
            ${{ env.CONTROLLER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # 3. Docker Compose smoke test (build + start only, no pytest)
  # ------------------------------------------------------------------
  smoke:
    name: Compose smoke (build + start)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: make demo (certs + up + metrics smoke)
        run: make demo

      - name: make down
        if: always()
        run: make down

  # ------------------------------------------------------------------
  # 4. Kind integration tests (full pytest suite)
  # ------------------------------------------------------------------
  integration-kind:
    name: Integration tests (kind)
    runs-on: ubuntu-latest
    needs: [build-push]
    # Only run on main pushes; PRs run smoke only to save time
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind

      - name: Install helm
        uses: azure/setup-helm@v4

      - name: Generate certs + client keys
        run: |
          go build -buildvcs=false -o bin/gen-artifacts ./cmd/gen-artifacts
          ./bin/gen-artifacts .

      - name: kind-up + pull images from GHCR + helm-install with Redis
        run: |
          make kind-up
          make images-pull IMAGE_TAG=${{ github.sha }}
          make helm-install-backends
          make helm-install-gateway \
            GATEWAY_EXTRA_SET="--set redis.enabled=true --set controller.enabled=true"

      - name: Full pytest suite (Redis enabled)
        run: make test-kind REDIS=1

      - name: kind-down
        if: always()
        run: make kind-down

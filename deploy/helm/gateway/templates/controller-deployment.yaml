{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-svc-gw-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: secure-svc-gw-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1                 # single-writer — leader election not needed
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-svc-gw-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-svc-gw-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: secure-svc-gw-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: controller
          image: {{ .Values.controller.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: CONTROLLER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONTROLLER_CR_NAME
              value: {{ .Values.controller.crName | default "main" | quote }}
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}

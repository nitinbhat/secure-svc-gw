{{- if .Values.tls.enabled }}
---
# Self-signed ClusterIssuer — only created when issuerName == "selfsigned".
# For production, point tls.issuerName at your real cert-manager issuer
# (Let's Encrypt, Vault, etc.) and remove this block.
{{- if eq .Values.tls.issuerName "selfsigned" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
  labels: {{- include "gw.labels" . | nindent 4 }}
spec:
  selfSigned: {}
{{- end }}
---
# Certificate for the gateway's client-facing HTTPS listener.
# cert-manager will create the Secret "gateway-listener-tls" and rotate it
# before expiry; the gateway pod picks up the new cert on next restart
# (or via an init-container / sidecar that watches for Secret changes).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-listener-tls
  labels: {{- include "gw.labels" . | nindent 4 }}
spec:
  secretName: gateway-listener-tls
  duration: 2160h      # 90 days
  renewBefore: 360h    # renew 15 days before expiry
  issuerRef:
    name: {{ .Values.tls.issuerName }}
    kind: {{ .Values.tls.issuerKind }}
  # Always cover the in-cluster service DNS names, plus any extra names
  # from tls.dnsNames (e.g. "localhost" for the port-forward demo/test
  # workflow, or a real public hostname for production).
  dnsNames:
    - gateway.{{ .Release.Namespace }}.svc.cluster.local
    - gateway
    {{- range .Values.tls.dnsNames }}
    - {{ . | quote }}
    {{- end }}
{{- end }}

{{- if .Values.redis.enabled }}
---
# Redis for distributed nonce (replay) cache.
# A single-node deployment is sufficient for the demo; replace with a
# managed Redis or a Redis Cluster for production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {{- include "gw.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
      app.kubernetes.io/part-of: secure-svc-gw
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis
        app.kubernetes.io/part-of: secure-svc-gw
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 1
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "gw.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: secure-svc-gw
  ports:
    - port: 6379
      targetPort: 6379
---
# Secret holding the Redis connection URL.
# Stored in a Secret (not in the CR) so credentials never appear in CR specs.
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gw.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis_url: {{ .Values.redis.url | quote }}
{{- end }}

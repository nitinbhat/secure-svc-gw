# 2-node kind cluster with the default CNI disabled so we can install
# Calico ourselves. Ports are exposed on the control-plane node so we can
# hit the gateway from the host via NodePort.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: secure-svc-gw
networking:
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080     # gateway client-facing
        hostPort: 8080
        protocol: TCP
      - containerPort: 30090     # gateway /metrics
        hostPort: 9090
        protocol: TCP
  - role: worker
